; VdMot Revamped - ESP32 (WT32-ETH01) firmware.
;
; Everything is pinned to exact versions (hc-version policy: no ^ranges, no bare
; git URLs) so a CI build byte-matches a local build.
;
; PARTITION TABLE: deliberately NOT overridden. The board default (default.csv:
; nvs 20 KB, otadata, app0/app1 1280 KB each, spiffs 1472 KB used as LittleFS)
; is the table of the legacy firmware. Devices are upgraded by OTA from the
; legacy firmware and OTA cannot change the partition table, so never set
; board_build.partitions here.
;
; Build:   pio run -j 2 -e wt32-eth01_revamped
; Tests:   see test/native/CMakeLists.txt (host build, not pio test)

[platformio]
default_envs = wt32-eth01_revamped

[common]
firmware_version = '"2.0.0-revamped"'
firmware_version_dev = '"2.0.0-revamped-dev"'
; Oldest STM firmware the ESP talks to (protocol v1). Informational gate.
min_stm_version = '"1.4.0"'

[env]
platform = espressif32@6.1.0
framework = arduino
board = wt32-eth01
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts =
	pre:tools/gen_web_assets.py
	; bounds the memory of one HTTP request in the web server library
	post:tools/patch_libs.py
lib_deps =
	bblanchon/ArduinoJson@6.21.6
	knolleary/PubSubClient@2.8
	khoih-prog/AsyncWebServer_WT32_ETH01@1.6.2
	me-no-dev/AsyncTCP@1.1.1
build_unflags =
	-std=gnu++11
build_flags =
	-std=gnu++17
	-O2
	-DVDM_MIN_STM_VERSION=${common.min_stm_version}
	; AsyncTCP: run the TCP task on core 0 next to lwIP, keep app tasks on core 1.
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0
	-DCONFIG_ASYNC_TCP_USE_WDT=1
	; ArduinoJson: no heap-hungry features in request parsing.
	-DARDUINOJSON_USE_LONG_LONG=1
	-DARDUINOJSON_ENABLE_STD_STRING=0
	-DARDUINOJSON_ENABLE_STD_STREAM=0
; Warnings for our own code only (libraries are not warning-clean).
build_src_flags =
	-Wall
	-Wextra

[env:wt32-eth01_revamped]
build_flags =
	${env.build_flags}
	-DVDM_VERSION=${common.firmware_version}
	-DCORE_DEBUG_LEVEL=0

[env:wt32-eth01_revamped_dev]
build_flags =
	${env.build_flags}
	-DVDM_VERSION=${common.firmware_version_dev}
	-DVDM_DEV_BUILD=1
	-DVDM_BUILD_EPOCH=$UNIX_TIME
	-DCORE_DEBUG_LEVEL=3
