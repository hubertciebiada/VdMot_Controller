[package]
name = "vdm-stm-glue"
description = "VdMot Revamped STM32: the logic of software_stm32/src over HAL traits (host-tested)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["terminal"]
# the debug terminal on USART6 (docs/rust/GLUE-DESIGN-STM.md §4.2, D7)
terminal = []

[dependencies]
# the no-init layout of the reset capture (system: the guard cell of sysstat)
vdm-stm-boot = { path = "../boot" }
vdm-stm-core = { path = "../core" }

[lints.rust]
unsafe_code = "forbid"
