# VdMot Revamped STM32 firmware in Rust: the host-testable crates.
# The firmware crate (firmware/, target thumbv7em-none-eabihf on embassy-stm32, own build) is
# not a member.
[workspace]
resolver = "2"
members = ["core", "boot", "glue", "image-check"]
exclude = ["firmware"]

[workspace.package]
# the version of the four images: firmware/build.rs writes it into the ID block, gvers reports
# it (D8: 2.2.0-revamped for the first Rust release, so gvers tells Rust from C++ 2.1.7)
version = "2.2.0-revamped"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
heapless = { version = "=0.9.3", default-features = false }

[profile.test]
# integer overflow is a bug in the port: the C++ wraps only where it means to (wrapping_*)
overflow-checks = true
