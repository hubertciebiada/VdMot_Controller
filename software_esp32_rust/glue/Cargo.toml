[package]
name = "vdm-esp-glue"
description = "VdMot Revamped ESP32: the glue logic over port traits (port of software_esp32_revamped/src)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
vdm-esp-core = { path = "../core" }
heapless.workspace = true

[dev-dependencies]
# the golden STM replies and the AN3155 simulator of testkit/fake_stm.rs
vdm-esp-core = { path = "../core", features = ["test-support"] }
[features]
# The dashboard (software_esp32_revamped/web) as web_server::assets::DASHBOARD, generated by
# build.rs with the gzip and ETag code of software_esp32_revamped/tools/gen_web_assets.py
# (python3 at build time). The firmware enables it; the host tests pass their own tables.
dashboard = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Big values never on a stack (docs/rust/GLUE-DESIGN-ESP.md 2.4); thresholds in clippy.toml.
large_stack_frames = "deny"
large_stack_arrays = "deny"
