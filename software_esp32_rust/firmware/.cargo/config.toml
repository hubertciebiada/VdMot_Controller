[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# time_t is 64 bit since ESP-IDF 5.0 (libc crate)
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# The target directory is a Docker volume (CARGO_TARGET_DIR): without this embuild does not find
# the crate root and ignores sdkconfig.defaults.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# partitions.csv into the ESP-IDF project of esp-idf-sys (CONFIG_PARTITION_TABLE_CUSTOM_FILENAME
# is relative to that project)
ESP_IDF_GLOB_PARTITIONS_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_PARTITIONS_CSV = "partitions.csv"
