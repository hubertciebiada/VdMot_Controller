[build]
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
linker = "ldproxy"
# time_t is 64 bit since ESP-IDF 5.0 (libc crate)
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]
# std without its default features: "backtrace" links gimli, addr2line and a symbolizer (about
# 150 KB of the image) that only runs with RUST_BACKTRACE set and needs the ELF file, neither of
# which exists on the device. A panic still prints its message; the ESP-IDF panic handler prints
# the registers and the backtrace addresses.
build-std-features = []

[env]
MCU = "esp32"
# The target directory is a Docker volume (CARGO_TARGET_DIR): without this embuild does not find
# the crate root and ignores sdkconfig.defaults.
CARGO_WORKSPACE_DIR = { value = "", relative = true }
# partitions.csv into the ESP-IDF project of esp-idf-sys (CONFIG_PARTITION_TABLE_CUSTOM_FILENAME
# is relative to that project)
ESP_IDF_GLOB_PARTITIONS_BASE = { value = ".", relative = true }
ESP_IDF_GLOB_PARTITIONS_CSV = "partitions.csv"
# The C++ build flags of the firmware version (core/src/version.rs reads them at compile time):
# VDM_VERSION is the version of this crate (Cargo.toml), VDM_MIN_STM_VERSION the one of
# software_esp32_revamped/platformio.ini.
VDM_VERSION = "2.1.7-revamped-rust"
VDM_MIN_STM_VERSION = "1.4.0"
